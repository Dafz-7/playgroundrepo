<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Span Example</title>
        <style>
            .highlight {
                background-color: yellow;
            }

            .red-text {
                color: red;
            }
        </style>
    </head>
    <body>
        <p>
            This is a normal sentence
            <span class="highlight">this part is highlighted</span>
            and <span class="red-text">this part is red</span>.
        </p>
    </body>
</html>
