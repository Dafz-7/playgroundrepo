<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Div Example</title>
        <style>
            .box {
                background-color: lightblue;
                padding: 10px;
                margin-bottom: 10px;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <h2>Section 1</h2>
            <p>This is inside a div. It groups a heading and a paragraph together.</p>
        </div>

        <div class="box">
            <h2>Section 2</h2>
            <p>This is another div. Notice how each div starts on a new line.</p>
        </div>
    </body>
</html>
